name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish
        run: ./gradlew publish --no-daemon --no-configuration-cache
        env:
          MAVEN_USER: ${{ secrets.OUTLANDS_MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.OUTLANDS_MAVEN_PASSWORD }}

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: mcinjector
          path: build/libs/*.jar
          if-no-files-found: error
