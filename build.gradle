plugins {
  id 'com.gradleup.shadow' version '9.6.1'
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

group = 'de.oceanlabs.mcp'
version = gitVersion()

ext {
    CHANGELOG = file("build/${project.name}-${project.version}-changelog.txt")
}

repositories {
    mavenCentral()
}

def gitCmd(List<String> args) {
    def result = providers.exec {
        commandLine(['git'] + args)
        ignoreExitValue = true
    }
    return result.standardOutput.asText.get().trim()
}

def gitVersion() {
    def describe = null
    try {
        describe = gitCmd(['describe', '--long', '--tags'])
    } catch (Exception ignored) {
    }
    if (!describe)
        return '0.0.0'

    // `git describe --long` yields <tag>-<commits>-g<hash>, or just <tag> when HEAD is tagged.
    def version = describe
    def m = describe =~ /^(.*)-(\d+)-g([0-9a-f]+)$/
    if (m.matches()) {
        def offset = m.group(2)
        version = offset == '0' ? m.group(1) : "${m.group(1)}.${offset}"
    }

    // Tag builds run from a detached HEAD, which has no branch name to append.
    def branch = null
    try {
        branch = gitCmd(['rev-parse', '--abbrev-ref', 'HEAD'])
    } catch (Exception ignored) {
    }
    if (branch && branch != 'master' && branch != 'HEAD')
        version += '-' + branch

    return version
}

jar {
    archiveClassifier = 'thin'
    manifest.attributes('Main-Class': 'de.oceanlabs.mcp.mcinjector.MCInjector')
    manifest.attributes('Implementation-Version': project.version)
}
shadowJar {
    archiveClassifier = 'fatjar'
    manifest.attributes('Main-Class': 'de.oceanlabs.mcp.mcinjector.MCInjector')
    manifest.attributes('Implementation-Version': project.version)
}

task sourceJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

assemble.dependsOn jar, shadowJar, sourceJar

def changelog = file('build/changelog.txt')
if (changelog.exists()) {
    CHANGELOG.write(changelog.text)
}

dependencies {
    implementation 'org.ow2.asm:asm:9.11.1'
    implementation 'org.ow2.asm:asm-tree:9.11.1'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
            if (CHANGELOG.exists())
                artifact source: CHANGELOG, classifier: 'changelog'
            pom {
                name = 'MCInjector'
                description = 'Utility for cleaning up Minecraft jar files for decompilation'
                url = 'https://github.com/Project-Outlands/MCInjector'
                scm {
                    url = 'https://github.com/Project-Outlands/MCInjector'
                    connection = 'scm:git:git://github.com/Project-Outlands/MCInjector.git'
                    developerConnection = 'scm:git:git@github.com:Project-Outlands/MCInjector.git'
                }
                issueManagement {
                    system = 'github'
                    url = 'https://github.com/Project-Outlands/MCInjector/issues'
                }

                developers {
                    developer {
                        id = 'Fesh0r'
                        name = 'Fesh0r'
                    }
                    developer {
                        id = 'Searge'
                        name = 'Searge'
                    }
                    developer {
                        id = 'cpw'
                        name = 'cpw'
                    }
                    developer {
                        id = 'LexManos'
                        name = 'Lex Manos'
                    }
                }

                licenses { //TODO: Ask the guys if I can license LGPL2.1 like everything else.
                    license {
                        name = ''
                        url = ''
                        distribution = 'repo'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Outlands'
            url = 'https://maven.outlands.top/releases'
            def user = project.findProperty('mavenUser') ?: System.getenv('MAVEN_USER')
            def pass = project.findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
            if (user && pass) {
                credentials {
                    username = user
                    password = pass
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it instanceof PublishToMavenRepository }) {
        def user = project.findProperty('mavenUser') ?: System.getenv('MAVEN_USER')
        def pass = project.findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
        if (!user || !pass) {
            throw new GradleException(
                'Missing Outlands credentials. Set -PmavenUser/-PmavenPassword or ' +
                'the MAVEN_USER/MAVEN_PASSWORD environment variables.')
        }
    }
}